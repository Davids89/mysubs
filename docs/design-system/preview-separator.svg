<svg xmlns="http://www.w3.org/2000/svg" width="520" height="48" viewBox="0 0 520 48" role="img" aria-label="Subtrack text separator: two hairlines with centred muted text">
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .bg { fill: #fbfbfa; }
    .s1 { fill: #f4f6f5; }
    .s2 { fill: #ffffff; }
    .t1 { fill: #1a1a1a; }
    .t2 { fill: #5a5a5a; }
    .tm { fill: #8a8a8a; }
    .meta { fill: #8a8a8a; font-size: 11px; }
    .bd { stroke: #e6e6e6; fill: none; }
    .bds { stroke: #c2c2c2; fill: none; }
    .ico { fill: none; stroke: #5a5a5a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .icom { stroke: #8a8a8a; }
    .icow { stroke: #ffffff; }
    .icog { stroke: #1D9E75; }
    .icor { stroke: #E24B4A; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .s1 { fill: #1c2128; }
      .s2 { fill: #161b22; }
      .t1 { fill: #e6edf3; }
      .t2 { fill: #9ca3af; }
      .tm { fill: #6e7681; }
      .meta { fill: #6e7681; }
      .bd { stroke: #30363d; }
      .bds { stroke: #6e7681; }
      .ico { stroke: #9ca3af; }
      .icom { stroke: #6e7681; }
    }
  </style>
  <rect class="bg" fill="none" stroke-width="0" x="0" y="0" width="520" height="48" rx="8"/>
  <line class="bd" stroke-width="0.5" x1="16" y1="24" x2="200" y2="24"/>
  <text class="tm" x="260.0" y="28" font-size="11" font-weight="400" text-anchor="middle">or continue with</text>
  <line class="bd" stroke-width="0.5" x1="320" y1="24" x2="504" y2="24"/>
</svg>
