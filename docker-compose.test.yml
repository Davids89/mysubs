services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: subtrack_test
      POSTGRES_USER: subtrack
      POSTGRES_PASSWORD: subtrack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subtrack -d subtrack_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data

  test:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: >
      sh -c "pnpm --filter @subtrack/backend db:deploy &&
      pnpm --filter @subtrack/backend test"
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://subtrack:subtrack@db:5432/subtrack_test?schema=public
      JWT_SECRET: test-jwt-secret
    depends_on:
      db:
        condition: service_healthy
