  <text fill="#0F6E56" x="150" y="164.4" font-size="15" font-weight="500">Forgot your password?</text>
  <text class="meta" x="335" y="163.0" font-size="11" font-weight="400">46px</text>
  <text class="meta" x="16" y="217.0" font-size="11" font-weight="400">Small</text>
  <rect fill="#1D9E75" stroke-width="0" x="150" y="196" width="49" height="34" rx="8"/>
