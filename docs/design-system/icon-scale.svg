<svg xmlns="http://www.w3.org/2000/svg" width="520" height="150" viewBox="0 0 520 150" role="img" aria-label="Subtrack icon sizes 16, 18, 22 and 24 pixels shown with the Tabler outline check icon, plus sample outline glyphs at 22 pixels">
