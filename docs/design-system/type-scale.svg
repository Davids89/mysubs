<svg xmlns="http://www.w3.org/2000/svg" width="560" height="248" viewBox="0 0 560 248" role="img" aria-label="Subtrack type scale: Title 22px/500, Heading 18px/500, Body 15px/400, Body small 14px/400, Label 11px/500, Caption 11px/400">
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .bg { fill: #ffffff; }
    .sample { fill: #1a1a1a; }
    .meta { fill: #8a8a8a; font-size: 11px; font-weight: 400; }
    .rule { stroke: #e6e6e6; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .sample { fill: #e6edf3; }
      .meta { fill: #8b949e; }
      .rule { stroke: #30363d; }
    }
  </style>
  <rect class="bg" width="560" height="248" rx="8"/>

  <text class="meta" x="16" y="40">Title · 22 / 500</text>
  <text class="sample" x="150" y="40" font-size="22" font-weight="500">Your subscriptions</text>
  <line class="rule" x1="16" y1="56" x2="544" y2="56"/>

  <text class="meta" x="16" y="84">Heading · 18 / 500</text>
  <text class="sample" x="150" y="84" font-size="18" font-weight="500">Expiring soon</text>
  <line class="rule" x1="16" y1="98" x2="544" y2="98"/>

  <text class="meta" x="16" y="124">Body · 15 / 400</text>
  <text class="sample" x="150" y="124" font-size="15" font-weight="400">Share a plan with the people you trust.</text>
  <line class="rule" x1="16" y1="136" x2="544" y2="136"/>

  <text class="meta" x="16" y="160">Body small · 14 / 400–500</text>
  <text class="sample" x="150" y="160" font-size="14" font-weight="500">Netflix</text>
  <text class="sample" x="215" y="160" font-size="14" font-weight="400">12,99 € / month</text>
  <line class="rule" x1="16" y1="172" x2="544" y2="172"/>

  <text class="meta" x="16" y="194">Label · 11 / 500</text>
  <text class="sample" x="150" y="194" font-size="11" font-weight="500">Email address</text>
  <line class="rule" x1="16" y1="206" x2="544" y2="206"/>

  <text class="meta" x="16" y="228">Caption · 10–11 / 400</text>
  <text class="sample" x="150" y="228" font-size="11" font-weight="400">Renews 14 Oct 2026</text>
</svg>
